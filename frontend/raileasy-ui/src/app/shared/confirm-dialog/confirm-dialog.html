<div class="confirm-dialog">
  <span class="confirm-dialog__icon" [class.confirm-dialog__icon--danger]="data.tone === 'danger'">
    <mat-icon>{{ data.tone === 'danger' ? 'delete_outline' : 'help_outline' }}</mat-icon>
  </span>

  <h2 mat-dialog-title>{{ data.title }}</h2>
  <div mat-dialog-content class="confirm-dialog__message">{{ data.message }}</div>

  <mat-dialog-actions align="end">
    <button class="re-btn re-btn--ghost" type="button" (click)="cancel()">{{ data.cancelLabel ?? 'Cancel' }}</button>
    <button
      type="button"
      class="re-btn"
      [class.re-btn--danger-solid]="data.tone === 'danger'"
      [class.re-btn--primary]="data.tone !== 'danger'"
      (click)="confirm()"
    >
      {{ data.confirmLabel ?? 'Confirm' }}
    </button>
  </mat-dialog-actions>
</div>

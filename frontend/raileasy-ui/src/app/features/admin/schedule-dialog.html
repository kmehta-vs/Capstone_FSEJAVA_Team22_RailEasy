<h2 mat-dialog-title>{{ isEdit ? 'Edit schedule' : 'Add schedule' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="dialog-form">
    <mat-form-field appearance="outline">
      <mat-label>Train</mat-label>
      <mat-select formControlName="trainId">
        @for (t of trains; track t.id) {
          <mat-option [value]="t.id">{{ t.trainName }} · {{ t.trainNumber }}</mat-option>
        }
      </mat-select>
      @if (form.controls.trainId.hasError('required')) {
        <mat-error>Select a train</mat-error>
      }
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>From station</mat-label>
        <input matInput formControlName="fromStation" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>To station</mat-label>
        <input matInput formControlName="toStation" />
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Departure</mat-label>
        <input matInput type="datetime-local" formControlName="departureTime" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Arrival</mat-label>
        <input matInput type="datetime-local" formControlName="arrivalTime" />
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Fare — Sleeper</mat-label>
        <input matInput type="number" formControlName="fareSleeper" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Fare — AC 3</mat-label>
        <input matInput type="number" formControlName="fareAc3" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Fare — AC 2</mat-label>
        <input matInput type="number" formControlName="fareAc2" />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button class="re-btn re-btn--ghost" type="button" (click)="cancel()">Cancel</button>
    <button class="re-btn re-btn--primary" type="submit">Save schedule</button>
  </mat-dialog-actions>
</form>
